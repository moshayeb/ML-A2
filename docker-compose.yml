services:
  api:
    build: ./MoCraft
    env_file: ./MoCraft/.env
    ports:
      - "8000:8000"
    volumes:
      - workspace:/app/workspace
      - logs:/app/logs
    restart: unless-stopped

  web:
    build: ./mocraft-web
    ports:
      - "3000:3000"
    environment:
      - MOCRAFT_HOST=api
      - MOCRAFT_PORT=8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  workspace:
  logs:
